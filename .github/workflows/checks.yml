name: Local and remote candidate checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gameassist_test
          POSTGRES_PASSWORD: ci-ephemeral-only
          POSTGRES_DB: gameassist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gameassist_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GA_TEST_POSTGRES_URL: postgresql://gameassist_test:ci-ephemeral-only@127.0.0.1:5432/gameassist_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt -r remote_server/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q server agent knowledge decoders deck remote_server
      - run: node --check web/app.js
      - run: node web/tests/check-ui.cjs
      - run: python -m knowledge knowledge/catalog.json
      - run: python -m knowledge.profiles knowledge/game_profiles.json
